[pytest]
# The suite is hermetic: nothing here talks to the real NWS, so it runs on a
# machine with no network and gives the same answer every time.
#
# The one exception is marked `network` and DESELECTED BY DEFAULT by the addopts
# below -- tests/test_nwsicons.py's check that the drawn icon set still matches
# what api.weather.gov publishes.  It is the only drift detector for NWS adding
# a condition, so it is meant to be run deliberately:
#
#     python -m pytest tests -m network
#
markers =
    network: reaches the real NWS API; deselected unless -m network is given
addopts = -m "not network"
