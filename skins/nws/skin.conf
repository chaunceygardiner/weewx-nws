[Extras]
    version = 6.0

[CheetahGenerator]
    # user.nws.NWSForecastVariables is the $nwsforecast tag API -- the
    # forecast itself, the drawn icons, and the NWS/CAP semantics every skin
    # needs.  user.nwsskin.NWSSkin is $nwsskin: THIS report's charts, chips
    # and alert cards, which are presentation and are not an API.  Copy the
    # second freely; it is meant to be a worked example.
    search_list_extensions = user.nws.NWSForecastVariables, user.nwsskin.NWSSkin
    [[ToDate]]
        [[[days]]]
            template = index.html.tmpl
        [[[hours]]]
            template = hours.html.tmpl
        [[[alerts]]]
            template = alerts.html.tmpl

[CopyGenerator]
    # copy_always, not copy_once: both files change from release to release,
    # and copy_once only writes a file that is not already there -- so an
    # upgraded skin would keep serving the previous stylesheet and script.
    copy_always = css/nws.css, scripts/nws.js

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
